name: Patch listings (re-Vision + recompute, no full pipeline)

# Manually-triggered targeted patch. Use this when the most-recent
# weekly run finished but specific listings have stale data (most often:
# Vision was rate-limited or out of credits when those listings were
# processed, so they kept their pre-fix condition_tier).
#
# Runs in ~10-20 minutes vs. ~2 hours for a full pipeline.
#
# What it does:
#   * Loads the current docs/listings.json
#   * Re-runs Vision on listings whose stored _n_photos < current photo
#     count (the Marietta-style "Vision saw only 1 photo, returned 'gut'
#     when the property has 6 photos and would've returned 'major'").
#   * Re-runs validation gate (state↔county, parcel, comp, numeric bounds)
#   * Re-runs calc + grade + data_quality on every listing
#   * Re-runs judgment_amount text-mining
#   * Writes back docs/listings.json + appends a "patches" entry to
#     docs/run_health.json
#   * Commits and pushes back to the branch
#
# Cost: only Vision API calls (~$0.01-0.03 per re-Vision; typically <$10).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VISION_PROVIDER: ${{ vars.VISION_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Run patch
        run: uv run python scripts/patch_listings.py

      # The .gz is what the dashboard fetches AND the only board file git will
      # ever commit — docs/listings.json is gitignored (>100MB). Asserting the
      # uncompressed twin proved the patch ran; it did not prove anything
      # publishable came out of it.
      - name: Verify patch produced a publishable artifact
        run: |
          test -f docs/listings.json.gz || { echo "::error::docs/listings.json.gz missing after patch"; exit 1; }
          test -f docs/run_meta.json    || { echo "::error::docs/run_meta.json missing after patch"; exit 1; }
          echo "Patched board: $(wc -c < docs/listings.json.gz) bytes gzipped"

      # THIS STEP PUBLISHED NOTHING FOR MONTHS.
      #
      # It ran `git add docs/listings.json docs/run_health.json 2>/dev/null ||
      # true`. docs/listings.json has been gitignored since 4120d30. git skips
      # the ignored path, stages the rest, and exits non-zero — and the `2>/dev/null
      # || true` swallowed both the message and the status. So the workflow
      # committed and pushed run_health.json ALONE: a health report describing a
      # board it did not ship. It never touched any .gz, the slim payload, the
      # detail shards or run_meta.json. (Verified in a throwaway repo.)
      #
      # scripts/board_payload.sh is now the single definition of what a publish
      # consists of, and board_payload_add stages each path in its own `git add`
      # so one bad pathspec can no longer void the whole publish.
      - name: Publish patched dashboard data back to repo
        run: |
          set -eu
          . ./scripts/board_payload.sh
          # THE ASSUMPTION THE PAYLOAD LIST RESTS ON, asserted rather than
          # assumed. docs/listings.json is gitignored (it exceeds GitHub's
          # 100MB/file limit and Pages excludes it), which is precisely why
          # board_payload_paths omits it and ships the .gz twin instead. Naming
          # an ignored path in `git add` makes git skip it, stage the rest and
          # exit non-zero — and with `2>/dev/null || true` around it, that is how
          # this step used to publish run_health.json alone. If it ever stops
          # being ignored, the publish list is wrong and someone must decide
          # what to do with a >100MB file before the next push.
          git check-ignore -q docs/listings.json || {
            echo "::error::docs/listings.json is no longer gitignored — the publish list in scripts/board_payload.sh needs revisiting"
            exit 1
          }
          # Fail the job if a required payload would 404 behind Jekyll's
          # prefix-matching exclude — better to keep the last good deploy than
          # to push data the site cannot serve.
          python3 scripts/check_pages_publish.py
          git config user.name "foreclosure-scraper-bot"
          git config user.email "actions@github.com"
          board_payload_add "$PWD"
          if git diff --cached --quiet; then
            echo "No payload changes — patch had no effect"
            exit 0
          fi
          git commit -m "patch: refresh stale Vision + recompute calc ($(date -u +%Y-%m-%d-%H%M))" || {
            echo "Nothing to commit"
            exit 0
          }
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep $((attempt * 2))
          done
          echo "::error::Failed to publish patched data after 3 attempts"
          exit 1

      - name: Surface patch summary in workflow summary
        if: always()
        run: |
          if [ -f docs/run_health.json ]; then
            uv run python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          h = json.loads(pathlib.Path("docs/run_health.json").read_text())
          patches = h.get("patches") or []
          if patches:
              p = patches[-1]
              print("### Patch applied")
              print(f"**Applied at:** {p.get('applied_at')}")
              print(f"**Listings after patch:** {p.get('total_listings_after_patch')}")
              print(f"**Vision:** {p.get('vision')}")
              print(f"**Validation:** {p.get('validation')}")
              print(f"**Data quality:** {p.get('data_quality')}")
          else:
              print("### Patch ran but produced no entry")
          PY
          fi
