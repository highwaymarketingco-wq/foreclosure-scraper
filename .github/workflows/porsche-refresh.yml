name: Porsche dashboard refresh

# Runs Screaming Frog headless on a GitHub Actions runner against the
# preset list in scripts/sf_crawl.py, then commits the refreshed
# docs/porsche.json / .csv (PR-style so branch protection on main stays
# intact). Once merged, GitHub Pages publishes the new dashboard.
#
# REQUIRED SECRETS — add at:
#   https://github.com/highwaymarketingco-wq/foreclosure-scraper/settings/secrets/actions
#
#   SF_LICENCE_USERNAME — your Screaming Frog account email/username
#   SF_LICENCE_KEY      — your Screaming Frog licence key
#
# (UK spelling matches Screaming Frog's own field names — the env vars
# below use _LICENCE_ to mirror.)

on:
  schedule:
    # Daily at 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Space-separated preset slugs, or 'all'"
        required: false
        default: "all"
      allow_unknown_price:
        description: "Keep listings without a discovered price (Elferspot 'request quote' etc). Default false — dashboard shows only actively-priced for-sale listings."
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: porsche-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SF_LICENCE_USERNAME: ${{ secrets.SF_LICENCE_USERNAME }}
      SF_LICENCE_KEY: ${{ secrets.SF_LICENCE_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sanity-check secrets are present
        run: |
          if [ -z "$SF_LICENCE_USERNAME" ] || [ -z "$SF_LICENCE_KEY" ]; then
            echo "::error::SF_LICENCE_USERNAME and SF_LICENCE_KEY secrets are not set."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Both SF secrets present (length only): "
          echo "  SF_LICENCE_USERNAME: ${#SF_LICENCE_USERNAME} chars"
          echo "  SF_LICENCE_KEY:      ${#SF_LICENCE_KEY} chars"

      - name: Install Screaming Frog SEO Spider (headless deps)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb wget curl ca-certificates fonts-dejavu-core \
            openjdk-21-jre-headless
          # The "latest" file isn't a fixed URL — scrape the download page
          # for the most recent .deb, fall back to a hard-coded version.
          DL_URL=$(curl -fsSL https://www.screamingfrog.co.uk/seo-spider/ \
            | grep -oE 'https://download\.screamingfrog\.co\.uk/products/seo-spider/screamingfrogseospider_[0-9.]+_all\.deb' \
            | head -1 || true)
          if [ -z "$DL_URL" ]; then
            echo "Couldn't auto-discover SF .deb URL; falling back to pinned version 21.6"
            DL_URL="https://download.screamingfrog.co.uk/products/seo-spider/screamingfrogseospider_21.6_all.deb"
          fi
          echo "Downloading: $DL_URL"
          curl -fL -o /tmp/sf.deb "$DL_URL"
          ls -lh /tmp/sf.deb
          sudo apt-get install -y --no-install-recommends /tmp/sf.deb || \
            sudo dpkg -i /tmp/sf.deb || \
            (sudo apt-get install -fy && sudo dpkg -i /tmp/sf.deb)
          which screamingfrogseospider
          # `head -20` closes its stdin → SIGPIPE on grep → pipefail kills the
          # step. `|| true` keeps this diagnostic line from failing the run.
          dpkg -L screamingfrogseospider | grep -E 'bin/|jar$' | head -20 || true

      - name: Write SF licence file + accept EULA
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ScreamingFrogSEOSpider"
          # Licence — multiple filename variants cover SF major versions.
          for f in licence.txt license.txt spider.licence spider.license; do
            cat > "$HOME/.ScreamingFrogSEOSpider/$f" <<EOF
          $SF_LICENCE_USERNAME
          $SF_LICENCE_KEY
          EOF
          done
          # SF 23 also blocks headless launch on EULA acceptance. Pre-write
          # the spider.config with every plausible EULA-accepted key name.
          cat > "$HOME/.ScreamingFrogSEOSpider/spider.config" <<'EOF'
          eulaAccepted=true
          eulaAcceptedVersion=15
          eula.accepted=true
          eula.accepted.version=15
          lastEulaAcceptedVersion=15
          licenceAgreed=15
          licenceAgreedVersion=15
          EOF
          chmod 600 "$HOME/.ScreamingFrogSEOSpider/"*
          ls -la "$HOME/.ScreamingFrogSEOSpider/"
          echo "--- spider.config ---"
          cat "$HOME/.ScreamingFrogSEOSpider/spider.config"
          echo "--- first line of each licence file (redacted) ---"
          for f in licence.txt license.txt spider.licence spider.license; do
            head -n 1 "$HOME/.ScreamingFrogSEOSpider/$f" | sed 's/./*/g' | tr -d '\n' | head -c 30
            echo "  ($f)"
          done

      - name: Verify SF binary is functional + dump FULL --help
        run: |
          set -euo pipefail
          which screamingfrogseospider
          echo "--- screamingfrogseospider --help (FULL output, looking for EULA/accept flags) ---"
          xvfb-run -a -- screamingfrogseospider --help 2>&1 | head -400 || true
          echo "--- grep for accept/eula/licence/agree flags ---"
          xvfb-run -a -- screamingfrogseospider --help 2>&1 \
            | grep -iE -- '--accept|--eula|--licence|--license|--agree|EULA|agreement' \
            || echo "(no obvious EULA flag in --help)"

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Install Python deps
        run: uv sync --frozen || uv sync

      - name: Install Patchright Chromium (used by porsche_scraper enrichers)
        run: uv run patchright install chromium

      - name: Run SF crawl + enrich + import (Xvfb-wrapped for safety)
        env:
          SITES: ${{ github.event.inputs.sites || 'all' }}
          ALLOW_UNKNOWN_PRICE: ${{ github.event.inputs.allow_unknown_price || 'false' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$SITES" = "all" ]; then
            ARGS+=(--all)
          else
            for s in $SITES; do ARGS+=("$s"); done
          fi
          if [ "$ALLOW_UNKNOWN_PRICE" = "true" ]; then
            ARGS+=(--allow-unknown-price)
          fi
          # SF needs a display server even in headless mode for some
          # rendering plugins; Xvfb provides a virtual one for free.
          xvfb-run -a -- uv run python scripts/sf_crawl.py "${ARGS[@]}"

      - name: Open a PR with the refreshed dashboard
        id: open_pr
        run: |
          set -euo pipefail
          if git diff --quiet docs/porsche.json docs/porsche.csv; then
            echo "No changes in docs/ — skipping PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          BRANCH="bot/porsche-refresh-$STAMP"
          git config user.name  "porsche-scraper-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add docs/porsche.json docs/porsche.csv
          git commit -m "porsche: refresh from SF crawl ($STAMP)"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR via GitHub CLI
        if: steps.open_pr.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.open_pr.outputs.branch }}" \
            --title "porsche: refresh dashboard from SF crawl" \
            --body "Automated refresh from .github/workflows/porsche-refresh.yml. Auto-merges once checks pass. Dashboard publishes at https://highwaymarketingco-wq.github.io/foreclosure-scraper/porsche.html"
          # Auto-merge so the daily refresh doesn't pile up open PRs
          # nobody clicks. If branch protection rejects the merge, the
          # PR stays open and a human can review — failure here doesn't
          # break the cron run.
          gh pr merge "${{ steps.open_pr.outputs.branch }}" \
            --auto --squash --delete-branch || \
            echo "::warning::auto-merge enable failed; PR left open for manual review"

      - name: Upload SF logs (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf-crawl-logs-${{ github.run_id }}
          # NB: GH Actions YAML does NOT expand `~` — must spell out $HOME.
          path: |
            /tmp/sf-porsche-*/**/*.csv
            /tmp/sf-porsche-*/**/*.log
            /home/runner/.ScreamingFrogSEOSpider/logs/*.log
            /home/runner/.ScreamingFrogSEOSpider/spider/**/*.log
          retention-days: 7
          if-no-files-found: ignore
