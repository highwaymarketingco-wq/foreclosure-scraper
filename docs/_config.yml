# GitHub Pages (Jekyll) config — trim the DEPLOYED site so the Pages build stays
# well under the 10-minute deploy timeout. These files stay in git (CI + local
# scripts still read them); they're just excluded from what Pages publishes:
#   - listings.json / listings_detail.json / listings_slim.json -> the dashboard
#     fetches the .gz copies (listings.json.gz / listings_detail.json.gz /
#     listings_slim.json.gz), which are re-included below.
#   - parcel_photos/  -> not referenced by dashboard.js or index.html (49 MB dead weight).
# Result: ~127 MB deploy -> ~8 MB.
#
# IMPORTANT: Jekyll's `exclude` matches by prefix (entry.start_with?(pattern)), so
# excluding `listings.json` ALSO drops `listings.json.gz` (the gz name starts with
# the excluded string). That silently 404'd the dashboard's data on the live site.
# `include` overrides `exclude` in Jekyll, so we re-include the .gz files the
# dashboard actually fetches. Do NOT remove the include block.
#
# THE RULE, so this never fires a third time: every `- <name>.json` you add to
# `exclude` MUST be accompanied, in the SAME edit, by `- <name>.json.gz` in
# `include`. Never land one without the other. `listings_slim.json` is the
# third instance of this pair. Verify with:
#   python3 scripts/check_pages_publish.py
# which reimplements Jekyll's start_with? over these two lists and every real
# filename in docs/, and fails if any dashboard payload would be dropped.
exclude:
  - listings.json
  - listings_detail.json
  - listings_slim.json
  - parcel_photos
  - path_to_100.md
  - path_to_100_deepdive.md
  - path_to_100_roadmap.md
  - goliath_teardown.md
  - completeness_audit.md
  - gap_ledger.md
  - rei_operator_playbook.md
  - hermes_blueprint.md
  - social_research_addendum.md
  - strategy_sources_buyers_playbook.md
include:
  - listings.json.gz
  - listings_detail.json.gz
  - listings_slim.json.gz
