[project]
name = "foreclosure-scraper"
version = "0.1.0"
description = "Comprehensive weekly foreclosure / tax sale / tax lien scraper for upstate SC and nearby NC counties"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "gspread>=6.1",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "playwright>=1.45",
    "pdfplumber>=0.11",
    "pypdf>=4.3",
    "tldextract>=5.1",
    "rich>=13.7",
    "structlog>=24.2",
    "tqdm>=4.66",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "homeharvest>=0.8.18",
    "scrapling[fetchers]>=0.4.8",
    # pydoll-python is an A/B-test alternate browser-automation library
    # — used by scrapers/law_firms/korn_pydoll.py to compare bypass
    # success vs Scrapling stealth on the same Korn target. Safe to
    # remove once we decide which library wins.
    "pydoll-python>=2.0",
    "curl-cffi>=0.15.0",
    "anthropic>=0.97.0",
    "google-genai>=1.0.0",
    # AWS WAF invisible/PoW solver deps for src/.../_vendor/awswaf/.
    # Lets Tyler get an aws-waf-token cookie without launching a browser,
    # avoiding the image-grid escalation we hit with Scrapling stealth.
    "pyscrypt>=1.6.2",
    "cryptography>=42",
]

[project.scripts]
foreclosure-scraper = "foreclosure_scraper.main:cli"
porsche-scraper = "porsche_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreclosure_scraper", "src/porsche_scraper"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0.3",
]
